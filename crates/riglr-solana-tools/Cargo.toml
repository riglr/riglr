[package]
name = "riglr-solana-tools"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
description = "A suite of rig-compatible tools for interacting with the Solana blockchain"
readme = "README.md"
keywords = ["solana", "ai", "agent", "blockchain", "rig"]
categories = ["cryptography::cryptocurrencies", "web-programming"]
documentation = "https://docs.rs/riglr-solana-tools"

[lints]
workspace = true

[dependencies]
# Core riglr and rig dependencies
rig-core = { workspace = true }
riglr-core = { workspace = true  }
riglr-config = { workspace = true  }
riglr-macros = { workspace = true  }

# Async and Error Handling
tokio = { workspace = true }
anyhow = { workspace = true }
thiserror = { workspace = true }
async-trait = { workspace = true }
once_cell = { workspace = true }

# Serialization and Schema
serde = { workspace = true }
serde_json = { workspace = true }
schemars = { workspace = true }

# Solana Dependencies
solana-sdk = { workspace = true }
solana-client = { workspace = true }
solana-commitment-config = { workspace = true }
solana-compute-budget-interface = { workspace = true }
solana-system-interface = { workspace = true }
spl-token = { workspace = true }
spl-associated-token-account = { workspace = true }
solana-transaction-status = { workspace = true }
solana-account-decoder = { workspace = true }
solana-address = { workspace = true }

# For EVM transaction types in TransactionSigner trait
alloy = { workspace = true }

# UUID generation
uuid = { workspace = true }

# Base64 encoding
base64 = { workspace = true }

# Binary encoding (using 1.3.3 for Solana SDK compatibility)
bincode = { workspace = true }

# HTTP client for Jupiter
reqwest = { workspace = true }

# Logging
tracing = { workspace = true }

# Random number generation for jitter
rand = { workspace = true }

# Futures utilities for async streams
futures-util = { workspace = true }

# New dependencies for event parsing
borsh = { workspace = true }
hex = { workspace = true }
bs58 = { workspace = true }
lazy_static = { workspace = true }
chrono = { workspace = true }
solana-pubkey = { workspace = true }

[dev-dependencies]
tokio-test = { workspace = true }
tracing-subscriber = { workspace = true }
criterion = { workspace = true }
mockito = { workspace = true }
proptest = { workspace = true }
lazy_static = { workspace = true }
dotenvy = { workspace = true }
testcontainers = { workspace = true }
testcontainers-modules = { workspace = true }

[features]
integration-tests = []


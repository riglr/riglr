[workspace]
resolver = "2"
members = [
    # Library Crates
    "crates/riglr-core",
    "crates/riglr-config",
    "crates/riglr-macros",
    "crates/riglr-agents",
    "crates/riglr-auth",
    "crates/riglr-events-core",
    "crates/riglr-solana-events",
    "crates/riglr-solana-tools",
    "crates/riglr-evm-common",
    "crates/riglr-evm-tools",
    "crates/riglr-web-tools",
    "crates/riglr-web-adapters",
    "crates/riglr-graph-memory",
    "crates/riglr-streams",
    "crates/riglr-indexer",
    "crates/riglr-hyperliquid-tools",
    "crates/riglr-asterdex",
    "crates/riglr-cross-chain-tools",
    "crates/riglr-server",
    "crates/riglr-showcase",

    # Application Services (THE ACTUAL BACKEND!)
    "services/api-gateway",
    "services/agent-worker",
    "services/event-ingester",
    "services/event-indexer",

    # CLI Tool
    "create-riglr-app"
]

[workspace.package]
version = "0.3.0"
edition = "2021"
license = "MIT"
authors = ["riglr project contributors"]
repository = "https://github.com/riglr/riglr"
homepage = "https://github.com/riglr/riglr"

[workspace.dependencies]
# Core riglr and rig dependencies
rig-core = "0.19.0"
riglr-core = { path = "crates/riglr-core" }
riglr-config = { path = "crates/riglr-config" }
riglr-macros = { path = "crates/riglr-macros" }
riglr-solana-tools = { path = "crates/riglr-solana-tools" }
riglr-evm-tools = { path = "crates/riglr-evm-tools" }
riglr-evm-common = { path = "crates/riglr-evm-common" }
riglr-web-tools = { path = "crates/riglr-web-tools" }
riglr-graph-memory = { path = "crates/riglr-graph-memory" }
riglr-web-adapters = { path = "crates/riglr-web-adapters" }
riglr-events-core = { path = "crates/riglr-events-core" }
riglr-solana-events = { path = "crates/riglr-solana-events" }
riglr-streams = { path = "crates/riglr-streams" }
riglr-agents = { path = "crates/riglr-agents" }
riglr-hyperliquid-tools = { path = "crates/riglr-hyperliquid-tools" }
riglr-asterdex = { path = "crates/riglr-asterdex" }
riglr-cross-chain-tools = { path = "crates/riglr-cross-chain-tools" }
riglr-auth = { path = "crates/riglr-auth" }
riglr-indexer = { path = "crates/riglr-indexer" }

# Async runtime
tokio = { version = "1", features = ["full"] }
async-trait = "0.1"
futures = "0.3"

# Error handling
anyhow = "1"
thiserror = "2"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
schemars = "0.8"
validator = { version = "0.18", features = ["derive"] }

# Blockchain specific
solana-sdk = "2.0"
solana-client = "2.0"
solana-transaction-status = "2.0"
solana-message = "2.0"
solana-system-interface = { version = "2.0", features = ["bincode"] }
solana-commitment-config = "2.0"
solana-compute-budget-interface = "2.0"
solana-account-decoder = "2.0"
solana-pubkey = "2.0"
solana-address = "1.0"
spl-token = "7.0"
spl-associated-token-account = "6.0"
alloy = { version = "0.6", features = ["dyn-abi", "json-abi", "rpc", "rpc-types", "providers", "network", "signers", "signer-local", "sol-types", "transport-http"] }

# HTTP clients
reqwest = { version = "0.12", features = ["json"] }
axum = { version = "0.8.4", features = ["ws"] }

# Database and caching
redis = { version = "0.27", features = ["tokio-comp", "json"] }
sqlx = { version = "0.8", features = ["runtime-tokio", "postgres"] }
tokio-test = "0.4"
criterion = "0.5"

# Utilities
rand = "0.9.2"
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-test = "0.2"
once_cell = "1.21"
dotenv = "0.15"
dotenvy = "0.15"
envy = "0.4"
toml = "0.9"
url = "2.5"
regex = "1.0"
tokio-retry = "0.3"
tokio-util = { version = "0.7", features = ["io"] }
tokio-tungstenite = "0.27.0"
tungstenite = "0.27.0"
proc-macro2 = "1.0"
quote = "1.0"
syn = { version = "2.0", features = ["full"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["cors", "fs", "trace"] }
hyper = "1.7"
clap = { version = "4", features = ["derive"] }
trybuild = "1.0"
config = "0.14"
humantime-serde = "1.1"
num_cpus = "1.16"
tokio-stream = "0.1"
tempfile = "3.8"
serial_test = "3.2"
dashmap = "6.1"
backoff = "0.4"
dirs = "5.0"
bincode = "1.3"
indexmap = "2.0"
base64 = "0.22"
ethers = "2"
lru = "0.16.0"
hex = "0.4"
jsonwebtoken = "9"
semver = "1.0"
bs58 = "0.5"
rust_decimal = "1.36"
k256 = "0.13"
quickcheck = "1.0"
quickcheck_macros = "1.0"
testcontainers = "0.24.0"
testcontainers-modules = "0.12.1"
futures-util = "0.3"
lazy_static = "1.4"
borsh = "0.10"
mockito = "1.0"
proptest = "1.0"

[workspace.lints.rust]
rust_2018_idioms = { level = "warn", priority = -1 }
rust_2024_compatibility = { level = "warn", priority = -1 }
unused_extern_crates = "warn"
missing_debug_implementations = "warn"
unsafe_code = "warn"

[workspace.lints.clippy]
# Note: In an ideal world, we'd conditionally allow these in tests only,
# but Cargo's cfg(test) target configuration doesn't work as expected with clippy
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }

# Beneficial restriction lints for safety and code quality
std_instead_of_core = "warn"
pattern_type_mismatch = "warn"
indexing_slicing = "warn"
arithmetic_side_effects = "warn"
absolute_paths = "warn"
module_name_repetitions = "warn"

# Test-related allows
# assertions_on_constants = "allow"  # Needed for test assertions like assert!(false, "...")
# missing_errors_doc = "allow"
# must_use_candidate = "allow"
# missing_panics_doc = "allow"
# too_many_lines = "allow"
# default_trait_access = "allow"
# similar_names = "allow"
# future_not_send = "allow"
# cast_possible_truncation = "allow"
# items_after_statements = "allow"
# redundant_pub_crate = "allow"
# single_match_else = "allow"
# multiple_crate_versions = "allow"
